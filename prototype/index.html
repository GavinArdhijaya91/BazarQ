<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BazarQ · Demo Antrean Digital untuk Bazar UMKM</title>
<meta name="description" content="Prototipe demo BazarQ: antrean digital ultra-lightweight untuk UMKM di bazar dan pop-up market. Scan QR, ambil nomor, tanpa aplikasi.">
<meta name="theme-color" content="#0B3FA0">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DynaPuff:wght@400;600;700&family=Fredoka:wght@400..800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=sks1">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#beranda"><span class="mark" aria-hidden="true"><img src="assets/favicon-32.png" width="30" height="30" alt="Logo BazarQ"></span> BazarQ</a>
    <nav class="nav" aria-label="Peran demo">
      <a href="#beranda" data-nav="beranda">Beranda</a>
      <a href="#pembeli" data-nav="pembeli">Pembeli</a>
      <a href="#merchant" data-nav="merchant">Merchant</a>
      <a href="#eo" data-nav="eo">Event Organizer</a>
      <a href="#daftar" data-nav="daftar">Buka Booth</a>
    </nav>
    <span class="presence-badge" id="presenceBadge" aria-live="polite">
      <span class="presence-dot" aria-hidden="true"></span>
      <span id="presenceCount">terhubung…</span>
    </span>
    <a class="btn btn-ghost btn-sm" id="btnExit" href="#beranda" hidden>← Keluar</a>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer class="foot wrap">
  <div>BazarQ · Technopreneurship Universitas Negeri Semarang</div>
  <button class="foot-reset" id="btnReset" type="button">Reset demo</button>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- Firebase SDK (compat — no bundler required) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- BazarQ config & app -->
<script src="js/firebase-config.js"></script>
<script src="js/app.js?v=sks1" defer></script>
</body>
</html>
